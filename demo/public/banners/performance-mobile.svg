<svg xmlns="http://www.w3.org/2000/svg" width="720" height="720" viewBox="0 0 720 720" role="img" aria-labelledby="title desc">
  <title id="title">Performance without the payload</title><desc id="desc">Dark blue mobile performance banner.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#172554"/></linearGradient><radialGradient id="glow"><stop stop-color="#3b82f6" stop-opacity=".75"/><stop offset="1" stop-color="#3b82f6" stop-opacity="0"/></radialGradient></defs>
  <rect width="720" height="720" rx="30" fill="url(#bg)"/><circle cx="515" cy="180" r="240" fill="url(#glow)" opacity=".55"/>
  <g fill="none" stroke="#60a5fa" stroke-opacity=".45"><ellipse cx="520" cy="185" rx="140" ry="56" transform="rotate(-18 520 185)"/><ellipse cx="520" cy="185" rx="140" ry="56" transform="rotate(42 520 185)"/><ellipse cx="520" cy="185" rx="140" ry="56" transform="rotate(102 520 185)"/></g>
  <circle cx="520" cy="185" r="28" fill="#eff6ff"/><circle cx="520" cy="185" r="9" fill="#2563eb"/>
  <g font-family="Inter,system-ui,sans-serif"><text x="54" y="318" fill="#60a5fa" font-size="17" font-weight="700" letter-spacing="3">PERFORMANCE FIRST</text><text x="54" y="400" fill="#fff" font-size="54" font-weight="750" letter-spacing="-2">Small payload.</text><text x="54" y="462" fill="#fff" font-size="54" font-weight="750" letter-spacing="-2">Full interaction.</text><text x="56" y="522" fill="#94a3b8" font-size="20">Zero runtime dependencies.</text><rect x="54" y="568" width="180" height="48" rx="24" fill="#2563eb"/><text x="144" y="599" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">≈ 2.7 kB gzip</text></g>
</svg>
