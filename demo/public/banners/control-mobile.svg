<svg xmlns="http://www.w3.org/2000/svg" width="720" height="720" viewBox="0 0 720 720" role="img" aria-labelledby="title desc">
  <title id="title">Styled defaults headless control</title><desc id="desc">Warm mobile banner showing a headless carousel code sample.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff7ed"/><stop offset="1" stop-color="#fef3c7"/></linearGradient></defs><rect width="720" height="720" rx="30" fill="url(#bg)"/>
  <g font-family="Inter,system-ui,sans-serif"><text x="52" y="84" fill="#c2410c" font-size="17" font-weight="700" letter-spacing="3">YOUR LEVEL OF CONTROL</text><text x="52" y="157" fill="#431407" font-size="49" font-weight="750" letter-spacing="-2">Styled or</text><text x="52" y="213" fill="#431407" font-size="49" font-weight="750" letter-spacing="-2">headless.</text><text x="54" y="260" fill="#9a3412" font-size="19">Customize without a ceiling.</text></g>
  <g transform="translate(52 326)"><rect width="616" height="310" rx="24" fill="#431407"/><rect x="20" y="20" width="576" height="40" rx="10" fill="#7c2d12"/><circle cx="42" cy="40" r="6" fill="#fb923c"/><circle cx="62" cy="40" r="6" fill="#fdba74"/><circle cx="82" cy="40" r="6" fill="#fed7aa"/><g font-family="ui-monospace,monospace" font-size="18"><text x="32" y="108" fill="#fdba74">const</text><text x="94" y="108" fill="#fff7ed">carousel = useCarousel({</text><text x="56" y="150" fill="#fed7aa">itemCount:</text><text x="176" y="150" fill="#fff7ed">slides.length,</text><text x="56" y="192" fill="#fed7aa">autoPlay:</text><text x="166" y="192" fill="#fb923c">true,</text><text x="56" y="234" fill="#fed7aa">loop:</text><text x="124" y="234" fill="#fb923c">true</text><text x="32" y="276" fill="#fff7ed">});</text></g></g>
</svg>
