<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="420" viewBox="0 0 1440 420" role="img" aria-labelledby="title desc">
  <title id="title">Styled defaults headless control</title><desc id="desc">Warm cream banner with a component and code panel.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff7ed"/><stop offset="1" stop-color="#fef3c7"/></linearGradient></defs><rect width="1440" height="420" rx="24" fill="url(#bg)"/>
  <g font-family="Inter,system-ui,sans-serif"><text x="78" y="92" fill="#c2410c" font-size="18" font-weight="700" letter-spacing="3">YOUR LEVEL OF CONTROL</text><text x="78" y="176" fill="#431407" font-size="58" font-weight="750" letter-spacing="-2">Styled or headless.</text><text x="80" y="236" fill="#9a3412" font-size="22">Start fast. Customize without a ceiling.</text><rect x="78" y="292" width="166" height="46" rx="23" fill="#431407"/><text x="161" y="321" text-anchor="middle" fill="#fff7ed" font-size="16" font-weight="700">Two entry points</text></g>
  <g transform="translate(830 62)"><rect width="520" height="296" rx="24" fill="#431407"/><rect x="22" y="22" width="476" height="42" rx="11" fill="#7c2d12"/><circle cx="45" cy="43" r="6" fill="#fb923c"/><circle cx="65" cy="43" r="6" fill="#fdba74"/><circle cx="85" cy="43" r="6" fill="#fed7aa"/><g font-family="ui-monospace,monospace" font-size="16"><text x="34" y="105" fill="#fdba74">const</text><text x="92" y="105" fill="#fff7ed">carousel = useCarousel({</text><text x="58" y="139" fill="#fed7aa">itemCount:</text><text x="166" y="139" fill="#fff7ed">slides.length,</text><text x="58" y="173" fill="#fed7aa">autoPlay:</text><text x="157" y="173" fill="#fb923c">true,</text><text x="58" y="207" fill="#fed7aa">loop:</text><text x="119" y="207" fill="#fb923c">true</text><text x="34" y="241" fill="#fff7ed">});</text></g></g>
